[package]
name = "typst-form"
version = "26.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Turns PDFs compiled with the typst-form Typst package into fillable forms"
repository = "https://github.com/yannickbecher/typst-form"
authors = ["Yannick Becher"]
keywords = ["typst", "pdf", "forms", "acroform"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
lopdf = { version = "0.47", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
open = "5"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
