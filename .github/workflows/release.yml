name: Release

# Start it from the Actions tab ("Run workflow") or with `just release feature`.
# It works out the next version yy.nn.ff from the latest v* tag and today's
# date, writes it everywhere, tests, commits, tags, builds and publishes.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "feature: new features or breaking changes (yy.nn+1.0), fix: bug fixes only (yy.nn.ff+1)"
        type: choice
        options: [feature, fix]
        default: feature
      dry-run:
        description: "Do everything except push, build and publish"
        type: boolean
        default: false

# No permissions by default; every job asks for exactly what it needs.
permissions: {}

# Two releases at the same time would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs the tests, which execute the build scripts of all dependencies. This
  # job cannot write to the repository and nothing it produces is trusted.
  check:
    name: Version and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Next version and files
        id: release
        env:
          KIND: ${{ inputs.kind }}
        run: bash .github/release-bump.sh

      # Never release a broken build; the tests also check that the version is
      # the same in the tool, the package, the docs and the changelog.
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml

  # Makes the release commit and the tag on a fresh runner. It runs no
  # dependency code: only .github/release-bump.sh (sed, awk, git) and cargo's
  # resolver, so the write token never meets untrusted code.
  prepare:
    name: Commit and tag
    needs: check
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release commit
        id: release
        env:
          KIND: ${{ inputs.kind }}
          COMMIT: "true"
          EXPECT_VERSION: ${{ needs.check.outputs.version }}
        run: bash .github/release-bump.sh

      - name: Push commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.release.outputs.version }}
        run: |
          git tag -a "v$V" -m "typst-form $V"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # Atomic: if main moved in the meantime, neither the commit nor the tag lands.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin HEAD:main "v$V"
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: ${{ !inputs.dry-run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # An older Linux image keeps the binary runnable on older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: typst-form
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: typst-form.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: typst-form
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: typst-form

    steps:
      # The tagged commit: `typst-form --version` shows the plain version.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp README.md LICENSE-MIT LICENSE-APACHE cli/target/${{ matrix.target }}/release/
          cd cli/target/${{ matrix.target }}/release
          tar czf typst-form-${{ matrix.target }}.tar.gz ${{ matrix.artifact }} README.md LICENSE-MIT LICENSE-APACHE
          mv typst-form-${{ matrix.target }}.tar.gz ../../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cp README.md, LICENSE-MIT, LICENSE-APACHE cli/target/${{ matrix.target }}/release/
          cd cli/target/${{ matrix.target }}/release
          7z a typst-form-${{ matrix.target }}.zip ${{ matrix.artifact }} README.md LICENSE-MIT LICENSE-APACHE
          mv typst-form-${{ matrix.target }}.zip ../../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: typst-form-${{ matrix.target }}
          path: typst-form-${{ matrix.target }}.*

  release:
    name: Publish release
    needs: [prepare, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          (cd artifacts && sha256sum * > SHA256SUMS)

      # The GitHub CLI is preinstalled on the runner; no third-party action
      # needs the write token.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$V" --notes-file notes.md --verify-tag

  # The documentation (GitHub Pages) always describes the latest release.
  # Needs Settings > Pages > Source: "GitHub Actions".
  docs-build:
    name: Build docs
    needs: [prepare, release]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Build the book
        run: |
          curl -fsSL -o mdbook.tgz https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          echo "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b  mdbook.tgz" | sha256sum -c -
          tar -xzf mdbook.tgz
          ./mdbook build book

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  docs-deploy:
    name: Publish docs
    needs: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
